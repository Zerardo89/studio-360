[package]
name = "studio360"
version = "0.1.0"
edition = "2021"

[dependencies]
ab_glyph = "0.2"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
epaint_default_fonts = { version = "0.37", features = ["monochrome_emoji_fonts"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
percent-encoding = "2"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
windows = { version = "0.62.2", features = [
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
