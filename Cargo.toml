[package]
name = "studio360"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.18"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
